# Pings the live site every 10 minutes from GitHub's servers, so it runs
# even when nobody's computer is on. Scheduled runs only happen on the
# default branch (main), and GitHub may start them a few minutes late.
name: Ping site

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions: {}               # needs no access to the repo

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping efficiencyv.work
        # /login, because "/" needs a login and just redirects there.
        # Retries ride out a slow wake-up; a failed run shows red in Actions
        # and GitHub emails you about it.
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
            --write-out "HTTP %{http_code} in %{time_total}s\n" \
            https://efficiencyv.work/login
