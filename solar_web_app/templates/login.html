<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efficiency V - Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../static/style.css">
  <link rel="stylesheet" href="../static/login.css">
  <script src="../static/theme.js"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand">
      <img class="auth-logo" src="{{ url_for('brand_logo') }}" alt="" width="88" height="88">
      <p class="auth-wordmark">Efficiency V</p>
    </div>

    <section class="auth-card" aria-label="Account access">
      <div class="auth-tabs" role="tablist" aria-label="Choose an option">
        <button type="button" class="auth-tab" role="tab" id="login-tab" aria-controls="login-panel" aria-selected="true" tabindex="0" data-auth-tab="login">Log in</button>
        <button type="button" class="auth-tab" role="tab" id="register-tab" aria-controls="register-panel" aria-selected="false" tabindex="-1" data-auth-tab="register">Register</button>
      </div>

      <div id="login-panel" class="auth-panel" role="tabpanel" aria-labelledby="login-tab">
        <form id="login-form" method="post" action="/login" data-auth-form>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="auth-field">
            <label for="username">Email</label>
            <input
              type="email"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="you@example.com"
              required
            >
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >
          </div>
          <p id="login-message" class="auth-message" role="alert" aria-live="polite"></p>
          <button type="submit" class="auth-submit">Log in</button>
        </form>
      </div>

      <div id="register-panel" class="auth-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
        <form id="register-form" method="post" action="/register" data-auth-form>
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="auth-field">
            <label for="register-username">Email</label>
            <input
              type="email"
              id="register-username"
              name="username"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>
          <div class="auth-field">
            <label for="register-password">Password</label>
            <input
              type="password"
              id="register-password"
              name="password"
              autocomplete="new-password"
              placeholder="Create a password"
              aria-describedby="register-password-hint"
              minlength="12"
              required
            >
            <span id="register-password-hint" class="auth-hint">Use 12 or more characters.</span>
          </div>
          <div class="auth-field">
            <label for="confirm-password">Confirm password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm_password"
              autocomplete="new-password"
              placeholder="Repeat your password"
              minlength="12"
              required
            >
          </div>
          <p id="register-message" class="auth-message" role="alert" aria-live="polite"></p>
          <button type="submit" class="auth-submit">Create account</button>
        </form>
      </div>
    </section>
  </main>
  <script src="/static/databricks.js"></script>
</body>
</html>
